# Based on the supplied mihomo_max.yaml; node identities removed. Local listeners and TUN default to safe portable settings.
basic:
  mixed-port: 7890
  allow-lan: false
  bind-address: 127.0.0.1
  mode: rule
  log-level: warning
  ipv6: false
  find-process-mode: 'off'
  unified-delay: true
  tcp-concurrent: true
  keep-alive-idle: 600
  keep-alive-interval: 15
  profile:
    store-selected: true
    store-fake-ip: true
  external-controller: 127.0.0.1:9090
  geodata-mode: true
  geo-auto-update: true
  geo-update-interval: 24
  sniffer:
    enable: true
    sniff:
      HTTP:
        ports:
        - 80
        - 8080
        override-destination: true
      TLS:
        ports:
        - 443
      QUIC:
        ports:
        - 443
    skip-domain:
    - +.push.apple.com
  tun:
    enable: false
    stack: system
    dns-hijack:
    - any:53
    auto-route: true
    auto-detect-interface: true
    strict-route: true
    udp: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  cache-algorithm: arc
  respect-rules: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
  - 223.5.5.5
  - 1.1.1.1
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://dns.alidns.com/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#🚀 节点选择
  - https://dns.google/dns-query#🚀 节点选择
  fallback:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.push.apple.com
  - +.tiktokdramacenter.com
  - +.shortdramas.com
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ALL
  - ♻️ IPv4自动
  - ♻️ 全部自动
  - protocol:vless
