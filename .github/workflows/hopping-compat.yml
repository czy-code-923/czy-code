name: Port hopping nftables compatibility
on:
  push:
    paths:
      - internal/api/bootstrap/agent-network.py
      - scripts/test_port_hopping.py
      - scripts/test_port_hopping_native.py
      - .github/workflows/hopping-compat.yml
  pull_request:
    paths:
      - internal/api/bootstrap/agent-network.py
      - scripts/test_port_hopping.py
      - scripts/test_port_hopping_native.py
      - .github/workflows/hopping-compat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debian12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test real nftables 1.0.6 ownership, forwarding and cleanup
        run: |
          docker run --rm --privileged \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            debian:12-slim sh -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends python3 nftables iproute2
              nft --version
              python3 /src/scripts/test_port_hopping.py
              unshare --net python3 /src/scripts/test_port_hopping_native.py
            '
