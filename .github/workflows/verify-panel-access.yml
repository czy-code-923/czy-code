name: Verify panel access maintenance
on:
  push:
    branches: [main]
    paths:
      - scripts/panel-access.py
      - scripts/test_panel_access.py
      - scripts/test_gateway_native.py
      - .github/workflows/verify-panel-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify maintenance logic
        run: python3 scripts/test_panel_access.py
      - name: Prepare disposable Linux gateway fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx iproute2
          npm --prefix web ci
          npm --prefix web run build
      - name: Verify real public listener closure, HTTPS and service autostart
        run: |
          STARHUB_TEST_GO="$(command -v go)" sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,STARHUB_TEST_GO python3 scripts/test_gateway_preflight.py
