name: Publish verified Starhub 0.16
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v016.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: starhub-release-016
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: harbor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify backend and frontend before publishing
        env:
          TEST_DATABASE_URL: postgres://harbor:ci-test-password@127.0.0.1:5432/harbor_test?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 ./...
          cd web
          npm ci
          npm test
          npm run build
      - name: Build four platforms and pin all artifacts
        run: python3 scripts/package-release.py
      - name: Commit generated installation checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/quickstart-distribution.json scripts/distribution-checksums.json
          git diff --cached --quiet || git commit -m 'Pin verified Starhub 0.16 release package checksums'
          git push origin HEAD:main
      - name: Publish release candidate and exact source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.16.0-distribution .release-output/* --target "$(git rev-parse HEAD)" --prerelease --latest=false --title '星枢 0.16 · 订阅检查与精确节点选择' --notes-file docs/RELEASE-v016.md
      - name: Verify fresh install, Agent onboarding and retirement
        run: |
          mkdir /tmp/starhub-distribution
          unzip -q .release-output/harbor-0.16.0-linux-amd64.zip -d /tmp/starhub-distribution
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/test_quickstart_e2e.py /tmp/starhub-distribution
      - name: Promote the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.16.0-distribution --prerelease=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-016-manifest
          path: .release-cache/manifest.json
