name: Verify Harbor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: harbor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: python3 scripts/test_domain_sync.py
      - run: python3 scripts/test_managed_gateway.py
      - run: python3 scripts/test_agent_bootstrap.py
      - run: python3 scripts/test_engine_installer.py
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
        env:
          TEST_DATABASE_URL: postgres://harbor:ci-test-password@127.0.0.1:5432/harbor_test?sslmode=disable
      - name: Validate nft syntax in an isolated network namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          go run ./cmd/firewall preview --file docs/firewall-example.json > /tmp/harbor-example.nft
          sudo unshare --net nft --check -f /tmp/harbor-example.nft
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch-engines.py
      - name: Native IPv4 and IPv6 forwarding
        shell: bash
        run: |
          ext=''; test "$RUNNER_OS" != Windows || ext='.exe'
          export TEST_SING_BOX_BINARY="$GITHUB_WORKSPACE/engines/sing-box$ext"
          export TEST_FRPS_BINARY="$GITHUB_WORKSPACE/engines/frps$ext"
          export TEST_FRPC_BINARY="$GITHUB_WORKSPACE/engines/frpc$ext"
          export TEST_XRAY_BINARY="$GITHUB_WORKSPACE/engines/xray$ext"
          go test -count=1 -v ./internal/live ./internal/executor ./internal/clientpolicy

  quickstart:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the immutable binary distribution
        run: |
          curl --proto '=https' --tlsv1.2 -fL https://github.com/czy-code-923/czy-code/releases/download/v0.14.1-distribution/harbor-0.14.1-linux-amd64.zip -o /tmp/starhub.zip
          echo 'cea4ac1c4772c593e3e0d710d52b42565d8564c8e20cdc176c5e92670d7917e4  /tmp/starhub.zip' | sha256sum --check
          mkdir /tmp/starhub-distribution
          unzip -q /tmp/starhub.zip -d /tmp/starhub-distribution
      - name: Install, enroll, deploy and uninstall on this fresh CI VM
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/test_quickstart_e2e.py /tmp/starhub-distribution
